services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    image: score-master-web:latest
    restart: unless-stopped
    env_file:
      - .env.production
    expose:
      - "8000"
    networks:
      - web
    labels:
      - traefik.enable=true
      - "traefik.http.routers.scoremaster.rule=Host(`${APP_DOMAIN}`)"
      - "traefik.http.routers.scoremaster.entrypoints=websecure"
      - "traefik.http.routers.scoremaster.tls.certresolver=letsencrypt"
      - "traefik.http.services.scoremaster.loadbalancer.server.port=8000"
      - "traefik.http.middlewares.scoremaster-https-redirect.redirectscheme.scheme=https"
      - "traefik.http.routers.scoremaster-http.rule=Host(`${APP_DOMAIN}`)"
      - "traefik.http.routers.scoremaster-http.entrypoints=web"
      - "traefik.http.routers.scoremaster-http.middlewares=scoremaster-https-redirect"
      - "traefik.docker.network=web"

networks:
  web:
    external: true
